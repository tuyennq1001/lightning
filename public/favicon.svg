<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="liviaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041210" />
      <stop offset="50%" stop-color="#061f1a" />
      <stop offset="100%" stop-color="#020807" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="liviaBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>

    <!-- Radial Emerald Aura -->
    <radialGradient id="liviaAura" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#0d9488" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#041210" stop-opacity="0" />
    </radialGradient>

    <!-- Ribbon L Stem Gradient -->
    <linearGradient id="ribbonStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Ribbon L Loop Gradient -->
    <linearGradient id="ribbonLoopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#14b8a6" />
      <stop offset="70%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>

    <!-- Spark Star Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="starBlur" />
      <feMerge>
        <feMergeNode in="starBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base (App Icon) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#liviaBgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#liviaAura)" />
  <rect x="17" y="17" width="478" height="478" rx="111" ry="111" fill="none" stroke="url(#liviaBorderGrad)" stroke-width="3" />

  <!-- Inner Ambient Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6" />

  <!-- Livia Stylized Ribbon "L" Graphic with Glow -->
  <g filter="url(#softGlow)">
    <!-- Base shadow/depth fold -->
    <path d="M168 132 C 168 120, 182 114, 192 122 L 230 152 C 238 158, 244 168, 244 178 L 244 290 C 244 326, 274 356, 310 356 L 358 356 C 370 356, 378 368, 372 380 L 356 408 C 350 418, 338 424, 326 424 L 232 424 C 182 424, 142 384, 142 334 L 142 160 C 142 144, 154 132, 168 132 Z" 
          fill="#034e3b" opacity="0.6" />

    <!-- Main Vertical Stem of the 'L' -->
    <path d="M 152 148 C 152 136, 164 126, 178 126 C 192 126, 204 136, 204 148 L 204 316 C 204 344, 226 366, 254 366 L 354 366 C 368 366, 380 378, 380 392 C 380 406, 368 418, 354 418 L 244 418 C 193 418, 152 377, 152 326 Z" 
          fill="url(#ribbonStemGrad)" />

    <!-- Overlapping Forward Swirl / Ribbon Wing -->
    <path d="M 174 274 C 190 240, 230 220, 276 220 C 330 220, 374 254, 388 304 C 392 318, 382 332, 368 332 C 356 332, 346 322, 342 312 C 332 284, 304 264, 274 264 C 242 264, 214 280, 202 306 Z" 
          fill="url(#ribbonLoopGrad)" />

    <!-- Dynamic Flow Accents -->
    <circle cx="276" cy="220" r="9" fill="#99f6e4" opacity="0.9" />
    <circle cx="372" cy="392" r="10" fill="#a7f3d0" />
  </g>

  <!-- Radiant AI Spark Star in Upper Right -->
  <g filter="url(#starGlow)" transform="translate(352, 128)">
    <!-- 4-Pointed Star -->
    <path d="M 0 -48 C 3 -16, 16 -3, 48 0 C 16 3, 3 16, 0 48 C -3 16, -16 3, -48 0 C -16 -3, -3 -16, 0 -48 Z" 
          fill="url(#sparkGrad)" />
    <!-- Center Bright Dot -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- Subtle Micro-Star Accents -->
  <g filter="url(#starGlow)" transform="translate(132, 396) scale(0.38)">
    <path d="M 0 -36 C 2 -12, 12 -2, 36 0 C 12 2, 2 12, 0 36 C -2 12, -12 2, -36 0 C -12 -2, -2 -12, 0 -36 Z" 
          fill="#5eead4" />
  </g>
  <g filter="url(#starGlow)" transform="translate(398, 240) scale(0.28)">
    <path d="M 0 -36 C 2 -12, 12 -2, 36 0 C 12 2, 2 12, 0 36 C -2 12, -12 2, -36 0 C -12 -2, -2 -12, 0 -36 Z" 
          fill="#34d399" />
  </g>
</svg>
